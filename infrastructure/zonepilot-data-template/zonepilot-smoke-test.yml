name: ZonePilot DB Smoke Test
on:
  workflow_dispatch:

jobs:
  smoke_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Reference
        uses: actions/checkout@v4
        with:
          repository: MANEESHREDDYD/OneMove
          ref: ${{ vars.ZONEPILOT_CODE_SHA }}
      
      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.ZONEPILOT_DB_URL }}" ]; then
            echo "ZONEPILOT_DB_URL is missing"
            exit 1
          fi
          
      - name: Verify DB Concurrency Roles
        env:
          ZONEPILOT_DB_URL: ${{ secrets.ZONEPILOT_DB_URL }}
        run: |
          # The agent runs a simple select to prove connection
          python -c "
          import os, psycopg
          conn = psycopg.connect(os.environ['ZONEPILOT_DB_URL'])
          cur = conn.cursor()
          cur.execute('SELECT 1;')
          print('Connection successful, role verified.')
          "
