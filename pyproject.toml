[project]
name = "zonepilot"
version = "0.1.0"
description = "ZonePilot Physical Commerce Network Simulator"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "httpx==0.27.0",
    "psycopg[binary,pool]==3.1.18",
    "PyYAML==6.0.1",
    "pytz==2024.1",
    "h3==3.7.6",
    "pyarrow==16.0.0",
    "PyJWT==2.8.0",
    "osmium==3.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "ruff==0.4.4"
]

[tool.ruff]
extend-exclude = [
    ".venv",
    "node_modules",
    "apps/observatory/node_modules",
    "java",
    "c",
    "*.ipynb"
]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "B008", "B904", "B017", "B011"]

[tool.ruff.lint.per-file-ignores]
"services/api/routers/*.py" = ["B008"]
"services/api/core/auth.py" = ["B008"]
"services/api/main.py" = ["B008"]
