[project]
name = "zonepilot"
version = "0.1.0"
description = "ZonePilot Physical Commerce Network Simulator"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "psycopg[binary,pool]>=3.1.18",
    "PyYAML>=6.0.1",
    "pytz>=2024.1",
    "h3>=4.1.0,<5",
    "pyarrow>=16.0.0",
    "geopandas>=1.0.0,<2",
    "networkx>=3.3,<4",
    "shapely>=2.0.0,<3",
    "PyJWT[crypto]>=2.8.0",
    "osmium>=3.6.0",
    "pandas>=2.0.0",
    "requests>=2.30.0",
    "supabase>=2.3.0",
    "python-dotenv>=1.0.0",
    "sentry-sdk[fastapi]>=2.0.0,<3"
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "ruff==0.4.4"
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "scripts*"]

[tool.ruff]
extend-exclude = [
    ".venv",
    "node_modules",
    "apps/observatory/node_modules",
    "java",
    "c",
    "*.ipynb"
]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "B008", "B904", "B017", "B011"]

[tool.ruff.lint.per-file-ignores]
"services/api/routers/*.py" = ["B008"]
"services/api/core/auth.py" = ["B008"]
"services/api/main.py" = ["B008"]

[tool.pytest.ini_options]
markers = [
    "r1_evidence: requires generated R1 geospatial and OSRM artifacts; runs in the ZonePilot R1 Evidence workflow",
]
