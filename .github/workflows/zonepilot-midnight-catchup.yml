name: ZonePilot Midnight Catchup

on:
  schedule:
    - cron: '45 18 * * *' # 18:45 UTC = 00:15 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  midnight-catchup:
    runs-on: ubuntu-latest
    
    concurrency:
      group: zonepilot-midnight # Same group to prevent overlap
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install httpx pyyaml pytz

      - name: Check Ledger and Run Catchup
        env:
          ZONEPILOT_DATA_ROOT: ${{ github.workspace }}/data_root
          PYTHONPATH: ${{ github.workspace }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          # The Midnight Collector script handles checking if it already ran.
          python services/collectors/scheduler_midnight.py

      - name: Upload Research Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zp-daily-bundle-catchup-${{ github.run_id }}
          path: ${{ github.workspace }}/data_root/private/official/
          retention-days: 365
