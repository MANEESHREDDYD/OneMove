name: Terraform CI

on:
  push:
    branches: [main]
    paths:
      - "infra/gcp/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/gcp/**"
      - ".github/workflows/terraform-ci.yml"

# Least privilege: this workflow only reads the repository. No job here uses
# OIDC, uploads SARIF, publishes packages, or comments on pull requests.
permissions:
  contents: read

jobs:
  validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Check Formatting
        run: terraform fmt -check -recursive infra/gcp

      - name: Validate Staging Configuration
        run: |
          cd infra/gcp/environments/staging
          terraform init -backend=false
          terraform validate

      - name: Validate Production Configuration
        run: |
          cd infra/gcp/environments/production
          terraform init -backend=false
          terraform validate
