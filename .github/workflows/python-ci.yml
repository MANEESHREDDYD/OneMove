name: Python CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Supabase CLI & Local Environment
      uses: supabase/setup-cli@v1
      with:
        version: 1.136.3
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install ruff pytest pandas httpx fastapi uvicorn pydantic pyjwt supabase pytz requests python-dotenv
    - run: pip install -e ./python
    - run: ruff check .
    - run: pytest
