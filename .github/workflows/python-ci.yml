name: Python CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Supabase CLI & Local Environment
      uses: supabase/setup-cli@v3
      with:
        version: 2.113.0
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - run: python -m pip install ruff==0.16.3 -r requirements.txt -r services/api/requirements.txt
    - run: pip install -e ./python
    - run: ruff check .
    - run: pytest -m "not r1_evidence"
