name: Python CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install ruff pytest pandas httpx fastapi pydantic pyjwt supabase pytz requests python-dotenv
    - run: pip install -e ./python
    - run: ruff check .
    - run: pytest
