name: Node.js CI
on: [push, pull_request]
# Least privilege: this workflow only reads the repository. No job here uses
# OIDC, uploads SARIF, publishes packages, or comments on pull requests.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    - run: npm test
    - run: npm run build
