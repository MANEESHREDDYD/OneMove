name: ZonePilot Intraday Acquisition

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      code_sha_override:
        description: 'Override ZONEPILOT_CODE_SHA for testing'
        required: false
        type: string

concurrency:
  group: zonepilot-intraday
  cancel-in-progress: true

jobs:
  run-intraday-acquisition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private execution repo
        uses: actions/checkout@v7

      - name: Resolve SHA to pin
        id: resolve-sha
        run: |
          if [ -n "${{ inputs.code_sha_override }}" ]; then
            echo "PINNED_SHA=${{ inputs.code_sha_override }}" >> $GITHUB_ENV
          else
            echo "PINNED_SHA=${{ vars.ZONEPILOT_CODE_SHA }}" >> $GITHUB_ENV
          fi
          echo "Expected SHA: $PINNED_SHA"

      - name: Checkout public ZonePilot code
        uses: actions/checkout@v7
        with:
          repository: MANEESHREDDYD/OneMove
          ref: ${{ env.PINNED_SHA }}
          path: zonepilot-code
          persist-credentials: false

      - name: Validate correct code SHA
        working-directory: zonepilot-code
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "${{ env.PINNED_SHA }}" ]; then
            echo "Error: SHA mismatch"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: zonepilot-code
        run: pip install -r requirements.txt

      - name: Execute Intraday Collectors
        working-directory: zonepilot-code
        env:
          ZONEPILOT_DB_URL: ${{ secrets.ZONEPILOT_DB_URL }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: python -m services.collectors.scheduler_intraday

      - name: Upload Intraday Interval Artifacts (2-day retention)
        uses: actions/upload-artifact@v7
        with:
          name: zp-interval-${{ github.run_id }}
          path: zonepilot-code/data_root/private/official/raw/
          retention-days: 2
