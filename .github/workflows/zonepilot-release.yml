name: ZonePilot Release Validation

on:
  push:
    branches: [ "main", "ws/**" ]
  pull_request:
    branches: [ "main", "ws/**" ]

jobs:
  release-hardening:
    name: ZonePilot Full Release Gate Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./python

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI & Local Environment
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Local Supabase Stack & Bootstrap Dynamic Credentials
        run: |
          echo 'SUPABASE_JWT_SECRET="REDACTED_SYNTHETIC_TEST_SECRET"' > supabase/.env
          supabase start
          supabase db reset
          STATUS_JSON=$(supabase status -o json)
          
          API_URL=$(echo "$STATUS_JSON" | jq -r '.API_URL')
          ANON_KEY=$(echo "$STATUS_JSON" | jq -r '.ANON_KEY')
          SERVICE_KEY=$(echo "$STATUS_JSON" | jq -r '.SERVICE_ROLE_KEY')
          JWT_SECRET=$(echo "$STATUS_JSON" | jq -r '.JWT_SECRET')
          
          if [ -z "$API_URL" ] || [ "$API_URL" = "null" ]; then
            echo "Error: Supabase API_URL is missing or null."
            exit 1
          fi
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo "Error: Supabase ANON_KEY is missing or null."
            exit 1
          fi
          if [ -z "$SERVICE_KEY" ] || [ "$SERVICE_KEY" = "null" ]; then
            echo "Error: Supabase SERVICE_ROLE_KEY is missing or null."
            exit 1
          fi
          if [ -z "$JWT_SECRET" ] || [ "$JWT_SECRET" = "null" ]; then
            echo "Error: Supabase JWT_SECRET is missing or null."
            exit 1
          fi

          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_KEY"
          echo "::add-mask::$JWT_SECRET"
          
          echo "SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV
          echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> $GITHUB_ENV
          echo "ZONEPILOT_DATA_ROOT=${{ github.workspace }}/data_root" >> $GITHUB_ENV
          echo "FAIL_ON_MISSING_SUPABASE=true" >> $GITHUB_ENV

      - name: Run Python Ruff Lint & Pytest Suite
        run: |
          ruff check .
          PYTHONPATH=services/api SUPABASE_JWT_SECRET=${{ env.SUPABASE_JWT_SECRET }} python -m uvicorn services.api.main:app --host 127.0.0.1 --port 8000 &
          
          # Wait for backend readiness
          for i in {1..15}; do
            curl -s http://127.0.0.1:8000/healthz && break
            echo "Waiting for Uvicorn..."
            sleep 1
          done
          
          SUPABASE_URL=http://127.0.0.1:54321 \
          SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
          SUPABASE_SERVICE_ROLE_KEY=${{ env.SUPABASE_SERVICE_ROLE_KEY }} \
          SUPABASE_JWT_SECRET=${{ env.SUPABASE_JWT_SECRET }} \
          pytest -v

      - name: Run Node Frontend Checks
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Run Vitest Unit & Security Suite
        run: npm test

      - name: Run Playwright E2E Integration Suite
        run: |
          pkill -f uvicorn || true
          PYTHONPATH=services/api python -m uvicorn services.api.main:app --host 127.0.0.1 --port 8000 &
          npm start -- -p 3000 &
          
          echo "Waiting for FastAPI backend..."
          timeout 60 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://127.0.0.1:8000/healthz)" != "200" ]]; do sleep 2; done' || (echo "Backend failed" && exit 1)
          
          echo "Waiting for Next.js frontend..."
          timeout 60 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' http://127.0.0.1:3000/)" != "200" ]]; do sleep 2; done' || (echo "Frontend failed" && exit 1)
          
          npx playwright test apps/observatory/tests/e2e/marketplace_probe_offline.spec.ts --project=chromium
          npx playwright test apps/observatory/tests/e2e/volunteer_order_offline.spec.ts --project=chromium
